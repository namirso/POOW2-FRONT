<div class="login-container">
  <div class="login-wrapper elevation-z5">

    <div class="login-visual">
      <div class="overlay">
        <h1>Sistema Review</h1>
        <p>Gerencie filmes, séries e avaliações em um só lugar.</p>
      </div>
    </div>

    <div class="login-form-section">
      <div class="form-header">
        <h2>Bem-vindo de volta!</h2>
        <p class="text-secondary">Insira suas credenciais para entrar.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="w-100 mb-2">
          <mat-label>Email</mat-label>
          <mat-icon matPrefix>email</mat-icon>
          <input matInput formControlName="login" placeholder="exemplo@email.com">
          <mat-error>Email inválido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100 mb-3">
          <mat-label>Senha</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="senha">
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-raised-button color="primary" class="w-100 py-2 fs-6 btn-login" type="submit">
          ACESSAR SISTEMA
        </button>

        <div class="mt-3 text-center">
          <a href="#" class="text-decoration-none text-muted small">Esqueceu a senha?</a>
        </div>
      </form>
    </div>
  </div>
</div>
