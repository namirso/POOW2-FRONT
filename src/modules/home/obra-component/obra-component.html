<div class="container mt-4">
  <h2>Gestão de Obras</h2>
  <mat-card class="p-3 mb-3">
    <form [formGroup]="form" (ngSubmit)="salvar()">
      <div class="row">
        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Nome da Obra</mat-label>
            <input matInput formControlName="nome">
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Direção</mat-label>
            <input matInput formControlName="direcao">
          </mat-form-field>
        </div>
        <div class="col-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Tipo</mat-label>
            <mat-select formControlName="tipo" [compareWith]="compareTipos">
              <mat-option *ngFor="let t of tipos" [value]="t">
                {{ t.nome }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <div class="d-flex justify-content-end gap-2">
        <button *ngIf="editing" mat-button type="button" (click)="resetForm()" color="warn">Cancelar</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">{{ editing ? 'Atualizar' : 'Salvar' }}</button>
      </div>
    </form>
  </mat-card>

  <table class="table table-hover" *ngIf="dados.length > 0">
    <thead><tr><th>Nome</th><th>Direção</th><th>Tipo</th><th class="text-end">Ações</th></tr></thead>
    <tbody>
    <tr *ngFor="let item of dados">
      <td>{{ item.nome }}</td>
      <td>{{ item.direcao }}</td>
      <td>{{ item.tipo?.nome }}</td>
      <td class="text-end">
        <button mat-icon-button color="primary" (click)="editar(item)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="deletar(item.id!)"><mat-icon>delete</mat-icon></button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
